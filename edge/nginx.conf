# Mac 2 (edge). Apple Silicon: /opt/homebrew/etc/nginx/nginx.conf  (Intel: /usr/local/etc/nginx/)
worker_processes 1;
events { worker_connections 1024; }

http {
    # Log shows WHICH backend served each request -> proof of load balancing.
    log_format lb '$remote_addr:$remote_port -> $upstream_addr [$status] "$request" $ssl_protocol';
    access_log /opt/homebrew/var/log/nginx/access.log lb;

    upstream backends {
        # round-robin by default. max_fails/fail_timeout = passive health check (Extension D):
        # a backend that fails once is skipped for 10s, then retried.
        server MAC3_IP:3001 max_fails=1 fail_timeout=10s;
        server MAC4_IP:3002 max_fails=1 fail_timeout=10s;
    }

    server {                                  # plain HTTP -> redirect to HTTPS
        listen 80;
        server_name app.team1.test api.team1.test;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;                       # use 8443 if 443 is not allowed
        http2 on;
        server_name app.team1.test api.team1.test;

        ssl_certificate     /opt/homebrew/etc/nginx/certs/app.team1.test.crt;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.team1.test.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backends;       # TLS ends here; edge -> backend is plain HTTP
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 2s;         # dead backend detected fast
            proxy_next_upstream error timeout http_502 http_503;  # retry on the other backend
        }
    }
}
