# Phase 2 Extension C - Backend isolation (Mac 4, backend port 3002)
# Allow loopback traffic
pass in quick on lo0 all
# Allow ONLY the edge (Mac 2) to reach the backend port
pass in quick proto tcp from 10.7.6.180 to any port 3002 flags S/SA keep state
# Block every other source from the backend port
block in quick proto tcp from any to any port 3002
