# Phase 2 Extension E - Standby edge nginx (Mac 3, 10.7.26.238)
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    upstream backend {
        server 10.7.26.238:3001 max_fails=2 fail_timeout=10s;
        server 10.7.21.46:3002 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 443 ssl;
        server_name app.team1.test;

        ssl_certificate     /Users/HARDIK3_USER/CN-Project/certs/app.team1.test.pem;
        ssl_certificate_key /Users/HARDIK3_USER/CN-Project/certs/app.team1.test-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
